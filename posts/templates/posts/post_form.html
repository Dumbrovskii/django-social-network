<div class="feed-card create-post-card mb-4">

    <form method="post" action="{% url 'create-post' %}">
        {% csrf_token %}

        <div class="d-flex align-items-center gap-3 mb-3">

            <div class="feed-avatar">
                <img src="{{ user.profile.profile_photo.url }}">
            </div>

            <div class="flex-grow-1">
                <textarea
                    name="content"
                    class="create-post-input w-100 text-start"
                    placeholder="What's on your mind, {{ user.username }}?"
                    rows="1"
                    required
                ></textarea>
            </div>

        </div>
        <button
            type="submit"
            id="post-button"
            class="btn-main w-50 mx-auto"
            style="display: none;"
        >
            Post
        </button>

        <div class="create-post-actions">

            <button type="button" class="create-post-action">
                <span>🖼️</span>
                Photo
            </button>

            <button type="button" class="create-post-action">
                <span>😊</span>
                Feeling
            </button>

            <button type="button" class="create-post-action">
                <span>📍</span>
                Location
            </button>

        </div>

    </form>

</div>
